name: CI

on:
  push:
    branches:
      - master
      - pidmint/main
      - 'pidmint/**'
  pull_request:
  workflow_dispatch:

jobs:
  nix-build-and-test:
    name: nix-build (compiler + runtime + test suite)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      # derivation.nix drives the full autotools build with a pinned modern
      # toolchain and runs `make test` in its checkPhase (doCheck = true),
      # so this one command is build + demo compile + HTTP smoke tests.
      - name: Build and test
        run: nix-build

      - name: Smoke-check installed compiler
        run: result/bin/urweb -version
