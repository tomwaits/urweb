name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build-and-test:
    name: nix-build (compiler + runtime + test suite)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      # Cache /nix/store across runs so the pinned nixpkgs (fetched by
      # default.nix) and the built compiler are not re-downloaded/rebuilt every
      # time. Fixes GitHub's HTTP 429 rate-limiting of the nixpkgs archive under
      # frequent CI, and makes CI dramatically faster (near-instant on cache hit).
      - uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('default.nix', 'derivation.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # derivation.nix drives the full autotools build with a pinned modern
      # toolchain and runs `make test` in its checkPhase (doCheck = true),
      # so this one command is build + demo compile + HTTP smoke tests.
      - name: Build and test
        run: nix-build

      # Compile a real app with the INSTALLED compiler, outside the build
      # sandbox: this exercises the CC/CCARGS/ICU paths baked into
      # config.sml, which `make test` inside the sandbox cannot see
      # (the cc-wrapper environment masks missing flags there).
      - name: Smoke-check installed compiler
        run: |
          result/bin/urweb -version
          result/bin/urweb demo/hello

  # Postgres RUNTIME integration. The nix-build job compiles + tests only on
  # sqlite (no network in the nix sandbox), so the Postgres codegen paths --
  # the startup schema-structure check (#230), timestamp handling (#163), the
  # generated DDL -- were never exercised at runtime. This job builds the
  # compiler with nix, then OUTSIDE the sandbox compiles a Postgres app with
  # the installed compiler (nix baked the libpq/gcc paths, so this works) and
  # runs it against a live Postgres service, asserting an insert/select round
  # trip through a real server.
  postgres-integration:
    name: postgres integration (runtime)
    # Run after nix-build so the store cache is warm (avoids both jobs
    # cold-fetching the pinned nixpkgs in parallel and racing the cache key).
    needs: nix-build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urwebtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      # Cache /nix/store across runs so the pinned nixpkgs (fetched by
      # default.nix) and the built compiler are not re-downloaded/rebuilt every
      # time. Fixes GitHub's HTTP 429 rate-limiting of the nixpkgs archive under
      # frequent CI, and makes CI dramatically faster (near-instant on cache hit).
      - uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('default.nix', 'derivation.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Build the compiler
        run: nix-build

      - name: Compile + run tests/pgtest against live Postgres
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: urwebtest
        run: |
          set -euo pipefail
          DB="host=localhost port=5432 dbname=urwebtest user=postgres password=postgres"
          # Compile the app + emit its schema DDL (compile does not connect).
          result/bin/urweb -dbms postgres -db "$DB" -sql tests/pgtest.sql tests/pgtest
          echo "=== emitted schema ==="; cat tests/pgtest.sql
          # Load the urweb-generated schema into the live database.
          psql "$DB" -v ON_ERROR_STOP=1 -f tests/pgtest.sql
          # Run the standalone server: this performs the startup schema-structure
          # check (#230) against the loaded schema before serving.
          tests/pgtest.exe -q -a 127.0.0.1 -p 8090 & echo $! > /tmp/pgtest.pid
          sleep 2
          out=$(curl -s 'http://localhost:8090/Pgtest/main' || true)
          kill "$(cat /tmp/pgtest.pid)" 2>/dev/null || true
          echo "=== response ==="; echo "$out"
          # Round trip through both tables and the view. The app only serves at
          # all if its startup schema-structure check passed on every relation.
          for want in 't1=hello' 'u1=note' 'v1=hello'; do \
            echo "$out" | grep -q "$want" \
              || { echo "postgres-integration FAILED: response missing '$want' (startup check or round trip broke)"; exit 1; }; \
          done
          echo "postgres-integration: PASS"
